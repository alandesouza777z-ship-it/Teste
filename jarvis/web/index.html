<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "./three.module.min.js" } }</script>
<style>
  :root {
    --fundo: #000;
    --branco: #ffffff;
    --texto: #ededed;
    --suave: rgba(255, 255, 255, 0.55);
    --apagado: rgba(255, 255, 255, 0.32);
    --linha: rgba(255, 255, 255, 0.12);
    --vidro: rgba(255, 255, 255, 0.035);
    --hud: "Rajdhani", "Segoe UI", sans-serif;
    --corpo: "Inter", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--fundo); color: var(--texto); overflow: hidden;
    font-family: var(--corpo); user-select: none; -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; display: block; }

  /* Vinheta cinematográfica */
  .vinheta { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.55) 80%, #000 100%); }

  /* Barra de título (janela sem bordas) */
  #titulo { position: fixed; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center;
    justify-content: space-between; padding: 0 8px 0 22px; z-index: 10; }
  .marca { font-family: var(--hud); font-weight: 600; letter-spacing: .55em; font-size: 13px; color: var(--branco);
    display: flex; align-items: center; gap: 14px; pointer-events: none; }
  .marca .ponto { width: 6px; height: 6px; border-radius: 50%; background: var(--branco);
    box-shadow: 0 0 10px var(--branco); animation: pulsar 2.4s ease-in-out infinite; }
  .marca small { font-weight: 500; letter-spacing: .35em; font-size: 10px; color: var(--apagado); }
  .controles { display: flex; gap: 2px; }
  .controles button { width: 42px; height: 30px; border: 0; background: transparent; color: var(--suave);
    cursor: pointer; border-radius: 6px; display: grid; place-items: center; transition: background .15s, color .15s; }
  .controles button:hover { background: rgba(255,255,255,.08); color: var(--branco); }
  .controles button.fechar:hover { background: rgba(255,255,255,.9); color: #000; }
  .controles svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.4; fill: none; }

  /* Painéis de vidro */
  .painel { position: fixed; top: 76px; width: 236px; padding: 18px 18px 16px; border: 1px solid var(--linha);
    background: linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.015));
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06); }
  .painel.esq { left: 26px; }
  .painel.dir { right: 26px; }
  .painel h2 { font-family: var(--hud); font-weight: 600; font-size: 11px; letter-spacing: .4em; color: var(--suave);
    display: flex; justify-content: space-between; margin-bottom: 16px; }
  .painel h2 span { color: var(--apagado); letter-spacing: .1em; font-weight: 500; }
  .medida { margin-bottom: 13px; }
  .medida .rotulo { display: flex; justify-content: space-between; font-family: var(--hud); font-size: 12px;
    letter-spacing: .18em; color: var(--suave); margin-bottom: 6px; }
  .medida .rotulo b { color: var(--branco); font-weight: 500; letter-spacing: .05em; font-variant-numeric: tabular-nums; }
  .barra-medida { height: 3px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
  .barra-medida i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, rgba(255,255,255,.5), #fff);
    box-shadow: 0 0 8px rgba(255,255,255,.7); transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .relogio { font-family: var(--hud); font-size: 40px; font-weight: 500; letter-spacing: .08em; color: var(--branco);
    line-height: 1; margin: 4px 0 4px; font-variant-numeric: tabular-nums; }
  .data { font-family: var(--hud); font-size: 11px; letter-spacing: .3em; color: var(--apagado); text-transform: uppercase;
    margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--linha); }

  #registro { list-style: none; display: flex; flex-direction: column; gap: 11px; max-height: 330px; overflow: hidden; }
  #registro li { font-size: 12.5px; line-height: 1.45; color: var(--suave); border-left: 1px solid var(--linha);
    padding-left: 10px; animation: entrar .4s ease both; }
  #registro li.jarvis { color: var(--texto); border-left-color: rgba(255,255,255,.6); }
  #registro li small { display: block; font-family: var(--hud); letter-spacing: .25em; font-size: 9.5px;
    color: var(--apagado); margin-bottom: 2px; text-transform: uppercase; }
  #registro .vazio { border: 0; padding: 0; color: var(--apagado); font-style: italic; }

  /* Centro inferior */
  #estado { position: fixed; left: 50%; bottom: 174px; transform: translateX(-50%); font-family: var(--hud);
    font-size: 12px; font-weight: 500; letter-spacing: .6em; margin-right: -.6em; color: var(--branco);
    text-transform: uppercase; pointer-events: none; text-shadow: 0 0 12px rgba(255,255,255,.6); }
  #tempos { position: fixed; left: 50%; bottom: 156px; transform: translateX(-50%); font: 500 10px var(--hud);
    letter-spacing: .25em; color: var(--apagado); text-transform: uppercase; pointer-events: none; }
  #legendas { position: fixed; left: 50%; bottom: 82px; transform: translateX(-50%);
    width: min(780px, calc(100% - 32px)); text-align: center; pointer-events: none; }
  #voce { color: var(--apagado); font-size: 13px; min-height: 18px; font-style: italic; }
  #fala { margin-top: 6px; font-size: 18px; font-weight: 300; line-height: 1.5; min-height: 27px; color: var(--branco);
    text-shadow: 0 0 22px rgba(255,255,255,.25); }
  #barra { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(820px, calc(100% - 32px));
    display: flex; align-items: center; gap: 10px; }
  #microfone { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,255,255,.4);
    background: rgba(255,255,255,.06); color: var(--branco); cursor: pointer; display: grid; place-items: center;
    backdrop-filter: blur(10px); transition: background .2s, box-shadow .2s, border-color .2s; }
  #microfone svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.6; fill: none; }
  #microfone:not(.mudo) { box-shadow: 0 0 0 0 rgba(255,255,255,.35); animation: aura 2.4s ease-out infinite; }
  #microfone.mudo { border-color: var(--linha); color: var(--apagado); background: transparent; }
  #microfone .risco { display: none; }
  #microfone.mudo .risco { display: block; }
  @keyframes aura { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.3); } 100% { box-shadow: 0 0 0 14px rgba(255,255,255,0); } }
  .modos { flex: none; display: flex; padding: 3px; border: 1px solid var(--linha); border-radius: 22px;
    background: var(--vidro); backdrop-filter: blur(10px); }
  .modos button { border: 0; background: transparent; color: var(--apagado); font: 600 10.5px var(--hud);
    letter-spacing: .22em; padding: 9px 12px; border-radius: 18px; cursor: pointer; transition: all .2s; }
  .modos button:hover { color: var(--branco); }
  .modos button.ativo { background: var(--branco); color: #000; }
  #entrada { flex: 1; min-width: 0; background: var(--vidro); border: 1px solid var(--linha); color: var(--texto);
    padding: 12px 20px; border-radius: 24px; font: 400 14px var(--corpo); outline: none; user-select: text;
    backdrop-filter: blur(10px); transition: border-color .2s, box-shadow .2s; }
  #entrada:focus { border-color: rgba(255,255,255,.45); box-shadow: 0 0 24px rgba(255,255,255,.08); }
  #entrada::placeholder { color: var(--apagado); }

  #confirmacao { position: fixed; left: 50%; bottom: 206px; transform: translateX(-50%); display: none; gap: 14px; }
  #confirmacao.ativa { display: flex; animation: entrar .3s ease both; }
  .botao { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.55); color: var(--branco);
    padding: 9px 30px; border-radius: 20px; font: 600 12px var(--hud); letter-spacing: .35em; cursor: pointer;
    backdrop-filter: blur(8px); }
  .botao:hover { background: var(--branco); color: #000; }

  #inicio { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px; background: rgba(0,0,0,.6); cursor: pointer; z-index: 20; transition: opacity .8s; }
  #inicio.visivel { display: flex; }
  #inicio.sumindo { opacity: 0; pointer-events: none; }
  #inicio h1 { font: 500 34px var(--hud); letter-spacing: .8em; margin-right: -.8em; color: var(--branco);
    text-shadow: 0 0 30px rgba(255,255,255,.5); }
  #inicio p { font: 500 12px var(--hud); letter-spacing: .45em; color: var(--apagado); text-transform: uppercase;
    animation: pulsar 2s ease-in-out infinite; }

  /* Navegação entre áreas */
  #navegacao { position: fixed; top: 50px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px;
    border: 1px solid var(--linha); border-radius: 22px; background: rgba(0,0,0,.35); backdrop-filter: blur(12px); z-index: 9; }
  #navegacao button { border: 0; background: transparent; color: var(--apagado); font: 600 10.5px var(--hud); letter-spacing: .24em;
    padding: 8px 13px; border-radius: 18px; cursor: pointer; transition: all .2s; }
  #navegacao button:hover { color: var(--branco); }
  #navegacao button.ativo { background: var(--branco); color: #000; }

  /* Painel de área (vidro sobre a esfera) */
  #area { position: fixed; top: 98px; left: 50%; transform: translate(-50%, 12px); width: min(1180px, calc(100% - 40px));
    bottom: 96px; display: flex; flex-direction: column; border: 1px solid var(--linha); border-radius: 18px;
    background: linear-gradient(160deg, rgba(18,18,18,.86), rgba(6,6,6,.9)); backdrop-filter: blur(22px);
    box-shadow: 0 30px 90px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.07); opacity: 0; pointer-events: none;
    transition: opacity .35s, transform .35s; z-index: 8; user-select: text; }
  body.com-area #area { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  body.com-area .painel, body.com-area #legendas #voce, body.com-area #tempos { opacity: 0; pointer-events: none; }
  body.com-area #cena { opacity: .45; transition: opacity .4s; }
  body.com-area #estado { bottom: 72px; font-size: 10px; }
  body.com-area #legendas { bottom: 96px; opacity: 0; }
  #area > header { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px 8px; }
  #area h2 { font: 600 20px var(--hud); letter-spacing: .4em; color: var(--branco); }
  #area-fechar { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--linha); background: transparent;
    color: var(--suave); font-size: 20px; cursor: pointer; }
  #area-fechar:hover { color: #000; background: var(--branco); }
  #area-conteudo { flex: 1; overflow-y: auto; padding: 8px 24px 24px; display: flex; flex-direction: column; gap: 18px; }
  #area-conteudo::-webkit-scrollbar { width: 6px; } #area-conteudo::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 3px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .kpi { border: 1px solid var(--linha); border-radius: 14px; padding: 14px 16px; background: rgba(255,255,255,.03); }
  .kpi small { display: block; font: 600 10px var(--hud); letter-spacing: .25em; color: var(--apagado); text-transform: uppercase; }
  .kpi b { display: block; font: 500 28px var(--hud); color: var(--branco); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 11px; color: var(--apagado); }
  .colunas { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; align-items: start; }
  .secao { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
  .secao h3 { font: 600 11px var(--hud); letter-spacing: .32em; color: var(--suave); text-transform: uppercase; }
  .dica { font-size: 12px; color: var(--apagado); line-height: 1.5; }
  .form-area { display: flex; flex-wrap: wrap; gap: 8px; }
  .form-area input, .form-area select, .form-area textarea, input.mini {
    flex: 1; min-width: 70px; background: rgba(255,255,255,.04); border: 1px solid var(--linha); border-radius: 10px;
    color: var(--texto); padding: 9px 12px; font: 400 13px var(--corpo); outline: none; }
  .form-area textarea { flex-basis: 100%; resize: vertical; }
  .form-area select option { background: #111; }
  .form-area input:focus, .form-area textarea:focus, input.mini:focus { border-color: rgba(255,255,255,.45); }
  input.mini { flex: 0 0 80px; padding: 6px 9px; } input.mini.largo { flex: 1; }
  .botao-area { border: 1px solid rgba(255,255,255,.5); background: transparent; color: var(--branco); border-radius: 10px;
    padding: 8px 14px; font: 600 10.5px var(--hud); letter-spacing: .2em; cursor: pointer; text-transform: uppercase; }
  .botao-area:hover, .botao-area.destaque { background: var(--branco); color: #000; }
  .excluir { border: 0; background: transparent; color: var(--apagado); font-size: 18px; cursor: pointer; padding: 0 4px; }
  .excluir:hover { color: var(--branco); }
  .vazio-area { color: var(--apagado); font-size: 12.5px; font-style: italic; }
  .lista { list-style: none; display: flex; flex-direction: column; }
  .lista li { display: flex; align-items: center; gap: 12px; padding: 9px 2px; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 13.5px; }
  .lista .data { font: 500 12px var(--hud); letter-spacing: .08em; color: var(--apagado); width: 44px; flex: none; text-transform: uppercase; }
  .lista .desc { flex: 1; min-width: 0; }
  .lista .desc small { display: block; font-size: 11.5px; color: var(--apagado); margin-top: 2px; white-space: pre-wrap; }
  .lista b { font-weight: 500; font-variant-numeric: tabular-nums; }
  .lista b.receita { color: #fff; } .lista b.despesa { color: var(--suave); }
  .barra-cat { display: grid; grid-template-columns: 110px 1fr 100px; align-items: center; gap: 10px; font-size: 12.5px; color: var(--suave); }
  .barra-cat i { height: 4px; border-radius: 2px; background: linear-gradient(90deg, rgba(255,255,255,.4), #fff); box-shadow: 0 0 8px rgba(255,255,255,.5); }
  .barra-cat b { text-align: right; font-weight: 500; color: var(--branco); }
  .habitos { display: flex; flex-direction: column; gap: 6px; }
  .habito { display: grid; grid-template-columns: minmax(160px, 1fr) repeat(7, 34px) 24px; align-items: center; gap: 8px;
    padding: 8px 4px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .habito.cabecalho small { text-align: center; font: 600 10px var(--hud); letter-spacing: .15em; color: var(--apagado); text-transform: uppercase; }
  .habito .nome small { display: block; font-size: 11px; color: var(--apagado); }
  .dia { width: 26px; height: 26px; margin: auto; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); background: transparent; cursor: pointer; }
  .dia.feito { background: var(--branco); box-shadow: 0 0 12px rgba(255,255,255,.6); }
  .grupo-titulo { font: 600 10px var(--hud); letter-spacing: .25em; color: var(--apagado); text-transform: uppercase; }
  .livros { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .livro { border: 1px solid var(--linha); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px; background: rgba(255,255,255,.03); }
  .livro.lido { opacity: .6; }
  .livro small { color: var(--apagado); font-size: 11.5px; }
  .progresso { height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; }
  .progresso i { display: block; height: 100%; background: #fff; box-shadow: 0 0 8px #fff; }
  .acoes { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .cliente .acoes input.mini.largo { flex: 1 1 100%; }
  .barra-crm { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  .barra-crm .form-area { flex: 1; }
  .funil { display: grid; grid-template-columns: repeat(4, minmax(200px, 1fr)); gap: 12px; align-items: start; }
  .coluna-funil { border: 1px solid var(--linha); border-radius: 14px; padding: 12px; background: rgba(255,255,255,.02); display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
  .coluna-funil h3 { font: 600 11px var(--hud); letter-spacing: .28em; color: var(--suave); text-transform: uppercase; display: flex; justify-content: space-between; }
  .coluna-funil h3 span { letter-spacing: .05em; color: var(--apagado); }
  .cliente { border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 10px 12px; background: rgba(255,255,255,.04); cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
  .cliente:hover { border-color: rgba(255,255,255,.35); }
  .cliente small { color: var(--apagado); font-size: 11.5px; }
  .cliente .detalhes { display: none; margin-top: 6px; font-size: 12px; color: var(--suave); }
  .cliente.aberto .detalhes { display: flex; flex-direction: column; gap: 6px; }
  .cliente .detalhes ul { list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .cliente .detalhes li small { margin-right: 6px; }
  @media (max-width: 900px) { .funil { grid-template-columns: repeat(2, 1fr); } #navegacao button { padding: 8px 8px; letter-spacing: .1em; } }

  @keyframes pulsar { 50% { opacity: .35; } }
  @keyframes entrar { from { opacity: 0; transform: translateY(6px); } }
  @media (max-width: 1080px) { .painel { display: none; } }
  @media (max-width: 640px) { .modos button { padding: 9px 8px; letter-spacing: .1em; } }
</style>
</head>
<body>
  <canvas id="cena"></canvas>
  <div class="vinheta"></div>

  <header id="titulo" class="pywebview-drag-region">
    <div class="marca"><span class="ponto"></span>J.A.R.V.I.S. <small>ONLINE</small></div>
    <div class="controles">
      <button data-acao="minimizar" title="Minimizar"><svg viewBox="0 0 12 12"><path d="M1 6h10"/></svg></button>
      <button data-acao="maximizar" title="Tela cheia"><svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9"/></svg></button>
      <button data-acao="fechar" class="fechar" title="Fechar"><svg viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9"/></svg></button>
    </div>
  </header>

  <nav id="navegacao">
    <button data-area="inicio" class="ativo">INÍCIO</button>
    <button data-area="financas">FINANÇAS</button>
    <button data-area="habitos">HÁBITOS</button>
    <button data-area="academia">ACADEMIA</button>
    <button data-area="leitura">LEITURA</button>
    <button data-area="aprendizado">APRENDIZADO</button>
    <button data-area="crm">CRM</button>
  </nav>

  <main id="area">
    <header><h2 id="area-titulo"></h2><button id="area-fechar" title="Voltar ao início (Esc)">×</button></header>
    <div id="area-conteudo"></div>
  </main>

  <aside class="painel esq">
    <div class="relogio" id="relogio">--:--</div>
    <div class="data" id="data"></div>
    <h2>SISTEMA <span>AO VIVO</span></h2>
    <div class="medida"><div class="rotulo">PROCESSADOR <b id="v-cpu">--</b></div><div class="barra-medida"><i id="b-cpu"></i></div></div>
    <div class="medida"><div class="rotulo">MEMÓRIA <b id="v-memoria">--</b></div><div class="barra-medida"><i id="b-memoria"></i></div></div>
    <div class="medida"><div class="rotulo">DISCO <b id="v-disco">--</b></div><div class="barra-medida"><i id="b-disco"></i></div></div>
    <div class="medida" id="m-bateria"><div class="rotulo">BATERIA <b id="v-bateria">--</b></div><div class="barra-medida"><i id="b-bateria"></i></div></div>
  </aside>

  <aside class="painel dir">
    <h2>REGISTRO <span id="contador">00</span></h2>
    <ul id="registro"><li class="vazio">Nenhuma interação ainda.</li></ul>
  </aside>

  <div id="estado">inicializando</div>
  <div id="tempos" title="Tempo para entender sua fala e para começar a responder"></div>
  <div id="confirmacao">
    <button class="botao" data-resposta="sim">SIM</button>
    <button class="botao" data-resposta="não">NÃO</button>
  </div>
  <div id="legendas">
    <div id="voce"></div>
    <div id="fala"></div>
  </div>
  <form id="barra" autocomplete="off">
    <button type="button" id="microfone" title="Parar / voltar a ouvir (Ctrl+M)">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
        <path class="risco" d="M4 4l16 16"/></svg>
    </button>
    <input id="entrada" placeholder="Fale comigo ou digite aqui">
    <div class="modos" title="Tamanho das respostas">
      <button type="button" data-modo="curta">CURTA</button>
      <button type="button" data-modo="moderada">MÉDIA</button>
      <button type="button" data-modo="longa">LONGA</button>
    </div>
  </form>

  <div id="inicio">
    <h1>J.A.R.V.I.S.</h1>
    <p>Clique para iniciar os sistemas</p>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
